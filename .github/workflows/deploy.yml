name: Deploy to cPanel

# main → production, staging → staging subdomains.
# Required secrets (per environment): CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY, CPANEL_SSH_PORT
# Required vars (per environment):    API_URL, SITE_URL, MEDIA_URL, TURNSTILE_SITE_KEY,
#                                     WEB_DIR, API_DIR   (absolute paths on the server)
# The staff portal is built into the web app's public/staff folder and served at <SITE_URL>/staff.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_MEDIA_URL: ${{ vars.MEDIA_URL }}
          MEDIA_ORIGIN: ${{ vars.MEDIA_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_API_URL: ${{ vars.API_URL }}

      - name: Assemble release
        run: |
          set -e
          mkdir -p release
          # Web: Next.js standalone server + static assets
          cp -r apps/web/.next/standalone release/web
          mkdir -p release/web/apps/web/.next
          cp -r apps/web/.next/static release/web/apps/web/.next/static
          cp -r apps/web/public release/web/apps/web/public
          # API: bundled dist + production node_modules (linux-x64, matches cPanel)
          pnpm --filter @itti/api deploy --prod --legacy release/api
          cp -r apps/api/dist release/api/dist
          cp apps/api/app.cjs release/api/app.cjs
          # Staff portal: already inside release/web/apps/web/public/staff (admin build output)
          test -f release/web/apps/web/public/staff/index.html

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # Accepts the key pasted as-is, or base64-encoded (base64 -i ~/.ssh/itti_deploy | pbcopy)
          KEY='${{ secrets.CPANEL_SSH_KEY }}'
          if printf '%s' "$KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          # Fails early with a clear message if the key secret is not a valid private key
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "CPANEL_SSH_KEY is not a valid private key (paste the file WITHOUT .pub, including BEGIN/END lines)"; exit 1; }
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT }} ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Upload
        env:
          SSH: ssh -p ${{ secrets.CPANEL_SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes
          TARGET: ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}
        run: |
          set -e
          # --exclude keeps server-only files (env, Passenger tmp, logs) in place
          rsync -az --delete -e "$SSH" --exclude '.env' --exclude 'tmp/' --exclude 'stderr.log' release/web/   "$TARGET:${{ vars.WEB_DIR }}/"
          rsync -az --delete -e "$SSH" --exclude '.env' --exclude 'tmp/' --exclude 'stderr.log' release/api/   "$TARGET:${{ vars.API_DIR }}/"

      - name: Migrate indexes & restart apps
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT }} -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} bash -s <<'REMOTE'
          set -e
          # cPanel (CloudLinux) puts Node on PATH only inside each app virtual environment
          ACT=$(ls -d "$HOME"/nodevenv/$(basename "${{ vars.API_DIR }}")/*/bin/activate 2>/dev/null | sort -V | tail -1)
          if [ -n "$ACT" ]; then source "$ACT"; fi
          command -v node >/dev/null || { echo "node not found: create the itti-api app in cPanel Setup Node.js App first"; exit 1; }
          node -v
          cd "${{ vars.API_DIR }}"
          node --env-file=.env dist/sync-indexes.js
          mkdir -p "${{ vars.API_DIR }}/tmp" "${{ vars.WEB_DIR }}/tmp"
          touch "${{ vars.API_DIR }}/tmp/restart.txt" "${{ vars.WEB_DIR }}/tmp/restart.txt"
          REMOTE

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS ${{ vars.API_URL }}/health
          curl -fsS -o /dev/null ${{ vars.SITE_URL }}
